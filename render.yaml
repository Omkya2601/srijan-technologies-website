# Render Blueprint — creates the API web service and its PostgreSQL database.
# In the Render dashboard: New > Blueprint > select this repo.
services:
  - type: web
    name: srijan-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run render:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: srijan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      # Your Vercel URL(s), comma-separated, e.g. https://srijan.vercel.app
      - key: CLIENT_URL
        sync: false
      - key: ADMIN_NAME
        value: Site Admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: srijan-db
    plan: free
    databaseName: srijan
